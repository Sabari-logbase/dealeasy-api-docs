openapi: 3.1.0
info:
  title: Dealeasy API
  version: 1.0.0
  description: >-
    Read the volume discounts a merchant has configured in Dealeasy, so you can
    display tiered quantity pricing in headless storefronts and custom apps.
servers:
  # TODO: replace with the production Dealeasy API host before publishing
  - url: https://api.dealeasy.app/api/public/v1
    description: Production
security:
  - DealeasyApiKey: []
tags:
  - name: Volume Discounts
paths:
  /volume-discounts:
    get:
      operationId: getVolumeDiscounts
      summary: Get volume discounts
      description: >-
        Returns the active volume discounts that apply to a product (and
        optionally a specific variant). Only discounts available to every
        customer are returned. Results are sorted best discount first.
      tags:
        - Volume Discounts
      parameters:
        - $ref: "#/components/parameters/ShopifyDomain"
        - name: productId
          in: query
          required: true
          description: >-
            The Shopify product ID, either numeric (`8012345678901`) or as a GID
            (`gid://shopify/Product/8012345678901`).
          schema:
            type: string
            example: gid://shopify/Product/8012345678901
        - name: variantId
          in: query
          required: false
          description: >-
            The Shopify variant ID, numeric or as a GID
            (`gid://shopify/ProductVariant/<id>`). Must belong to `productId`.
            Required to match discounts that target specific variants.
          schema:
            type: string
            example: gid://shopify/ProductVariant/44012345678901
        - name: country
          in: query
          required: false
          description: >-
            The buyer's country as an ISO 3166-1 alpha-2 code (case-insensitive).
            Validated but does not currently change the result.
          schema:
            type: string
            pattern: "^[A-Za-z]{2}$"
            example: US
        - name: locale
          in: query
          required: false
          description: >-
            The buyer's language as a BCP 47 tag. Validated but does not
            currently change the result.
          schema:
            type: string
            example: en-US
      responses:
        "200":
          description: >-
            The request succeeded. `eligible` is `false` and `volumeDiscounts`
            is empty when no volume discount applies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolumeDiscountResponse"
              examples:
                eligible:
                  summary: Product has volume discounts
                  value:
                    eligible: true
                    volumeDiscounts:
                      - discountId: gid://shopify/DiscountAutomaticNode/1234567890
                        title: Buy more, save more
                        method: AUTOMATIC_DISCOUNT
                        discountCode: null
                        discountType: PERCENTAGE
                        fixedQuantityDiscount: false
                        applicationStrategy: INDIVIDUAL_PRODUCTS
                        currencyCode: USD
                        discountTiers:
                          - id: tier-1
                            quantity: 2
                            value: 5
                            highlight: NONE
                            isDefault: false
                          - id: tier-2
                            quantity: 3
                            value: 10
                            highlight: MOST_POPULAR
                            isDefault: true
                          - id: tier-3
                            quantity: 5
                            value: 15
                            highlight: BEST_SAVINGS
                            isDefault: false
                notEligible:
                  summary: No volume discount applies
                  value:
                    eligible: false
                    volumeDiscounts: []
        "400":
          description: The request is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
              examples:
                missingProductId:
                  summary: Missing productId
                  value:
                    code: INVALID_REQUEST
                    message: productId is required.
                invalidDomain:
                  summary: Invalid x-shopify-domain
                  value:
                    code: INVALID_REQUEST
                    message: x-shopify-domain must be the store's myshopify.com domain, e.g. your-store.myshopify.com.
                variantMismatch:
                  summary: Variant does not belong to the product
                  value:
                    code: INVALID_REQUEST
                    message: variantId does not belong to productId.
        "401":
          description: Authentication failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
              examples:
                missingHeader:
                  summary: Missing header
                  value:
                    code: MISSING_AUTHORIZATION_HEADER
                    message: "Missing required header(s): x-dealeasy-api-key."
                invalidApiKey:
                  summary: Invalid API key or store domain
                  value:
                    code: INVALID_API_KEY
                    message: The API key is invalid for this store.
                unauthorized:
                  summary: Integration inactive or revoked
                  value:
                    code: UNAUTHORIZED
                    message: This integration is inactive or has been revoked.
        "403":
          description: The integration is missing the required scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
              example:
                code: FORBIDDEN
                message: This integration does not have the read_volume_discounts scope.
        "429":
          description: Too many requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
              example:
                code: TOO_MANY_REQUESTS
                message: Too many requests. Please retry after a short delay.
        "500":
          description: An unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseError"
              example:
                code: INTERNAL_SERVER_ERROR
                message: An unexpected error occurred. Please try again later.
components:
  securitySchemes:
    DealeasyApiKey:
      type: apiKey
      in: header
      name: x-dealeasy-api-key
      description: >-
        Your integration API key, in the format
        `dealeasy_<integrationId>_<secret>`. Use it server-side only.
  parameters:
    ShopifyDomain:
      name: x-shopify-domain
      in: header
      required: true
      description: >-
        The store's myshopify.com domain that the integration belongs to
        (case-insensitive).
      schema:
        type: string
        example: your-store.myshopify.com
  schemas:
    VolumeDiscountResponse:
      type: object
      required: [eligible, volumeDiscounts]
      properties:
        eligible:
          type: boolean
          description: "`true` when at least one volume discount applies."
        volumeDiscounts:
          type: array
          description: Applicable volume discounts, best discount first.
          items:
            $ref: "#/components/schemas/VolumeDiscount"
    VolumeDiscount:
      type: object
      required:
        - discountId
        - title
        - method
        - discountCode
        - discountType
        - fixedQuantityDiscount
        - applicationStrategy
        - currencyCode
        - discountTiers
      properties:
        discountId:
          type: string
          description: The Shopify discount GID.
          example: gid://shopify/DiscountAutomaticNode/1234567890
        title:
          type: string
          description: The discount title set by the merchant.
        method:
          type: string
          enum: [AUTOMATIC_DISCOUNT, CODE_DISCOUNT]
          description: How the discount is applied at checkout.
        discountCode:
          type: [string, "null"]
          description: The code to apply for `CODE_DISCOUNT`; `null` for `AUTOMATIC_DISCOUNT`.
        discountType:
          type: string
          enum: [PERCENTAGE, FIXED_AMOUNT]
          description: How each tier's `value` is interpreted.
        fixedQuantityDiscount:
          type: boolean
          description: >-
            `true` if a tier only applies at exactly its `quantity`; `false` if
            it applies at its `quantity` or more.
        applicationStrategy:
          type: string
          enum: [INDIVIDUAL_PRODUCTS, ALL_PRODUCTS, INDIVIDUAL_VARIANT]
          description: How quantities are counted toward a tier.
        currencyCode:
          type: [string, "null"]
          description: The store's currency (ISO 4217). `FIXED_AMOUNT` values are in this currency.
          example: USD
        discountTiers:
          type: array
          description: Tiers in ascending order of quantity.
          items:
            $ref: "#/components/schemas/DiscountTier"
    DiscountTier:
      type: object
      required: [id, quantity, value, highlight, isDefault]
      properties:
        id:
          type: string
          description: Tier identifier, unique within the discount (`tier-1`, `tier-2`, ...).
          example: tier-1
        quantity:
          type: integer
          minimum: 1
          description: Quantity that unlocks the tier.
        value:
          type: number
          description: >-
            Discount per item. A percentage (0-100) for `PERCENTAGE`, or an
            amount in `currencyCode` for `FIXED_AMOUNT`.
        highlight:
          type: string
          enum: [NONE, MOST_POPULAR, BEST_SAVINGS]
          description: Badge the merchant chose for this tier.
        isDefault:
          type: boolean
          description: "`true` for the tier that should be preselected."
    ResponseError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - INVALID_API_KEY
            - MISSING_AUTHORIZATION_HEADER
            - UNAUTHORIZED
            - FORBIDDEN
            - TOO_MANY_REQUESTS
            - INTERNAL_SERVER_ERROR
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable description. Don't parse it; it may change.
